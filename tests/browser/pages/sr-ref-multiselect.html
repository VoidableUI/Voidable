<!-- Reference multi-select comboboxes for the screen-reader probes: the ARIA Authoring Practices select-only
     combobox with a multiselectable listbox (focus stays on the combobox, the highlighted option is its
     aria-activedescendant), in three variants, so a run shows what a reader says when an option is
     highlighted and when it is chosen:
       explicit  every option carries aria-selected="true" or "false" (the practice's own advice)
       absent    unchosen options carry no aria-selected, which is what void-multiselect writes
       live      explicit, and a polite status line says "<option> selected" or "<option> not selected" -->
<main>
  <h1>Multiselect references</h1>
  <div class="ref" data-variant="explicit"><span id="l1">Explicit skills</span><div id="c1" role="combobox" tabindex="0" aria-labelledby="l1" aria-haspopup="listbox" aria-expanded="false" aria-controls="o1"></div>
    <div id="o1" role="listbox" aria-multiselectable="true" aria-labelledby="l1" hidden>
      <div id="o1-css" role="option">CSS</div><div id="o1-js" role="option">JavaScript</div><div id="o1-html" role="option">HTML</div>
    </div></div>
  <div class="ref" data-variant="absent"><span id="l2">Absent skills</span><div id="c2" role="combobox" tabindex="0" aria-labelledby="l2" aria-haspopup="listbox" aria-expanded="false" aria-controls="o2"></div>
    <div id="o2" role="listbox" aria-multiselectable="true" aria-labelledby="l2" hidden>
      <div id="o2-css" role="option">CSS</div><div id="o2-js" role="option">JavaScript</div><div id="o2-html" role="option">HTML</div>
    </div></div>
  <div class="ref" data-variant="live"><span id="l3">Live skills</span><div id="c3" role="combobox" tabindex="0" aria-labelledby="l3" aria-haspopup="listbox" aria-expanded="false" aria-controls="o3"></div>
    <div id="o3" role="listbox" aria-multiselectable="true" aria-labelledby="l3" hidden>
      <div id="o3-css" role="option">CSS</div><div id="o3-js" role="option">JavaScript</div><div id="o3-html" role="option">HTML</div>
    </div>
    <div id="status3" role="status" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></div></div>
  <!-- As void-multiselect renders its trigger: an aria-label, and children (a placeholder span, then a pill with a
       remove button) that are replaced when an option is chosen. "children": as it was. "hidden": the children are aria-hidden. -->
  <div class="ref" data-variant="children"><div id="c4" role="combobox" tabindex="0" aria-label="Children skills" aria-haspopup="listbox" aria-expanded="false" aria-controls="o4"></div>
    <div id="o4" role="listbox" aria-multiselectable="true" aria-label="Children skills" hidden>
      <div id="o4-css" role="option">CSS</div><div id="o4-js" role="option">JavaScript</div><div id="o4-html" role="option">HTML</div>
    </div></div>
  <div class="ref" data-variant="hidden"><div id="c5" role="combobox" tabindex="0" aria-label="Hidden skills" aria-haspopup="listbox" aria-expanded="false" aria-controls="o5"></div>
    <div id="o5" role="listbox" aria-multiselectable="true" aria-label="Hidden skills" hidden>
      <div id="o5-css" role="option">CSS</div><div id="o5-js" role="option">JavaScript</div><div id="o5-html" role="option">HTML</div>
    </div></div>
</main>
<script>
  for (const root of document.querySelectorAll('.ref')) {
    const variant = root.dataset.variant;
    const combo = root.querySelector('[role=combobox]');
    const list = root.querySelector('[role=listbox]');
    const options = [...list.querySelectorAll('[role=option]')];
    const status = root.querySelector('[role=status]');
    let active = -1;
    const text = () => options.filter((o) => o.getAttribute('aria-selected') === 'true').map((o) => o.textContent).join(', ');
    const show = () => {
      if (variant !== 'children' && variant !== 'hidden') { combo.textContent = text() || 'None'; return; }
      combo.replaceChildren();
      const chosen = options.filter((o) => o.getAttribute('aria-selected') === 'true');
      const parts = chosen.length
        ? chosen.map((o) => { const s = document.createElement('span'); s.append(o.textContent + ' '); const b = document.createElement('button'); b.type = 'button'; b.tabIndex = -1; b.setAttribute('aria-label', 'Remove ' + o.textContent); b.textContent = '×'; s.append(b); return s; })
        : [Object.assign(document.createElement('span'), { textContent: 'Pick skills' })];
      for (const p of parts) { if (variant === 'hidden') p.setAttribute('aria-hidden', 'true'); combo.append(p); }
    };
    const highlight = (i) => {
      active = Math.max(0, Math.min(options.length - 1, i));
      for (const [n, o] of options.entries()) o.classList.toggle('active', n === active);
      combo.setAttribute('aria-activedescendant', options[active].id);
    };
    const open = () => {
      list.hidden = false;
      combo.setAttribute('aria-expanded', 'true');
      if (variant !== 'absent' && variant !== 'children' && variant !== 'hidden') for (const o of options) if (!o.hasAttribute('aria-selected')) o.setAttribute('aria-selected', 'false');
      highlight(Math.max(active, 0));
    };
    const close = () => {
      list.hidden = true;
      combo.setAttribute('aria-expanded', 'false');
      combo.removeAttribute('aria-activedescendant');
    };
    const toggle = () => {
      const o = options[active];
      const on = o.getAttribute('aria-selected') !== 'true';
      if (variant === 'absent' || variant === 'children' || variant === 'hidden') { if (on) o.setAttribute('aria-selected', 'true'); else o.removeAttribute('aria-selected'); }
      else o.setAttribute('aria-selected', String(on));
      show();
      if (status) status.textContent = `${o.textContent} ${on ? 'selected' : 'not selected'}`;
    };
    show();
    combo.addEventListener('click', () => (list.hidden ? open() : close()));
    combo.addEventListener('keydown', (e) => {
      const isOpen = !list.hidden;
      if (e.key === 'ArrowDown') { e.preventDefault(); if (!isOpen) open(); else highlight(active + 1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); if (!isOpen) open(); else highlight(active - 1); }
      else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (!isOpen) open(); else toggle(); }
      else if (e.key === 'Escape' && isOpen) { e.preventDefault(); close(); }
    });
    combo.addEventListener('blur', close);
  }
</script>
