<main>
  <h1>Sign up</h1>
  <form id="signup" novalidate>
    <void-field id="email-field" label="Email address" helper="We never share it." required>
      <void-input id="email" type="email" name="email" required></void-input>
    </void-field>
    <void-field id="code-field" label="Invite code" error="Enter the six character code.">
      <void-input id="code" name="code" value="abc"></void-input>
    </void-field>
  </form>
</main>
