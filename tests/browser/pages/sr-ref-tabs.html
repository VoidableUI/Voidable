<!-- Reference tabs for the screen-reader probes: the ARIA Authoring Practices tabs, plain HTML and a little script
     (manual activation: arrows move focus, Enter or Space select), beside nothing else, so a run shows whether a
     reader says anything for the pattern, and if it does not, that the page or the reader is the cause, not void-tabs. -->
<main>
  <h1>Tabs reference</h1>
  <div role="tablist" aria-label="Reference sections">
    <button type="button" role="tab" id="t-profile" aria-selected="true" aria-controls="p-profile" tabindex="0">Profile</button>
    <button type="button" role="tab" id="t-billing" aria-selected="false" aria-controls="p-billing" tabindex="-1">Billing</button>
    <button type="button" role="tab" id="t-team" aria-selected="false" aria-controls="p-team" tabindex="-1">Team</button>
  </div>
  <div role="tabpanel" id="p-profile" aria-labelledby="t-profile" tabindex="0">Your profile details.</div>
  <div role="tabpanel" id="p-billing" aria-labelledby="t-billing" tabindex="0" hidden>Your invoices and cards.</div>
  <div role="tabpanel" id="p-team" aria-labelledby="t-team" tabindex="0" hidden>The people on your team.</div>
</main>
<script>
  const tabs = [...document.querySelectorAll('[role=tab]')];
  const select = (tab) => {
    for (const t of tabs) {
      const on = t === tab;
      t.setAttribute('aria-selected', String(on));
      t.tabIndex = on ? 0 : -1;
      document.getElementById(t.getAttribute('aria-controls')).hidden = !on;
    }
  };
  for (const tab of tabs) {
    tab.addEventListener('click', () => select(tab));
    tab.addEventListener('keydown', (e) => {
      const i = tabs.indexOf(tab);
      if (e.key === 'ArrowRight') { e.preventDefault(); tabs[(i + 1) % tabs.length].focus(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); tabs[(i + tabs.length - 1) % tabs.length].focus(); }
    });
  }
</script>
