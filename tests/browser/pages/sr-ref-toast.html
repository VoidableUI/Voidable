<!-- Reference announcements for the screen-reader probes: a polite status region that exists from load (as the
     toast container's announcer does), written to after a button is pressed, with different delays, so a run shows
     how long after the button's own speech VoiceOver needs before it will say a live-region change. The toast
     writes 150 ms after the toast is added. Each button is pressed twice by the probe: the second press repeats
     the same words. The last one is an assertive alert region. -->
<main>
  <h1>Announcement references</h1>
  <button type="button" data-delay="0" data-kind="status">Announce at 0 ms</button>
  <button type="button" data-delay="150" data-kind="status">Announce at 150 ms</button>
  <button type="button" data-delay="600" data-kind="status">Announce at 600 ms</button>
  <button type="button" data-delay="1500" data-kind="status">Announce at 1500 ms</button>
  <button type="button" data-delay="150" data-kind="alert">Announce alert at 150 ms</button>
  <div id="polite" role="status" aria-live="polite" aria-atomic="true" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></div>
  <div id="assertive" role="alert" aria-live="assertive" aria-atomic="true" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></div>
</main>
<script>
  for (const button of document.querySelectorAll('button[data-delay]')) {
    button.addEventListener('click', () => {
      const region = document.getElementById(button.dataset.kind === 'alert' ? 'assertive' : 'polite');
      const text = `Saved after ${button.dataset.delay} milliseconds`;
      region.textContent = '';
      setTimeout(() => { region.textContent = text; }, Number(button.dataset.delay));
      setTimeout(() => { region.textContent = ''; }, Number(button.dataset.delay) + 5000);
    });
  }
</script>
