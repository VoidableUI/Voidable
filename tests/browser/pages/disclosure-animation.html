<main style="padding: 2rem; max-width: 40rem">
  <h1>Disclosure animation</h1>
  <button id="before">before</button>

  <void-collapsible id="co">
    <void-collapsible-trigger>Shipping details</void-collapsible-trigger>
    <void-collapsible-content id="co-content">
      <p>Ships in two days.</p>
      <p>A second paragraph so the height is not a round number.</p>
      <p id="co-needle">Zanzibar marmalade ledger</p>
      <button type="button" id="co-btn">Inside</button>
    </void-collapsible-content>
  </void-collapsible>

  <void-accordion id="ac">
    <void-accordion-item id="ac-1">
      <void-accordion-trigger>First</void-accordion-trigger>
      <void-accordion-content id="ac-1-content">
        <p>First body.</p>
        <p id="ac-needle">Quokka vermilion almanac</p>
        <button type="button" id="ac-btn">Inside</button>
      </void-accordion-content>
    </void-accordion-item>
    <void-accordion-item id="ac-2">
      <void-accordion-trigger>Second</void-accordion-trigger>
      <void-accordion-content id="ac-2-content"><p>Second body, with</p><p>several</p><p>lines of text.</p></void-accordion-content>
    </void-accordion-item>
  </void-accordion>
  <button id="after">after</button>
</main>
