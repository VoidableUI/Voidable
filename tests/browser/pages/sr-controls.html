<main>
  <h1>Preferences</h1>
  <void-checkbox id="terms">Accept the terms</void-checkbox>
  <void-radio-group id="plan" label="Plan" name="plan" value="free">
    <void-radio value="free">Free</void-radio>
    <void-radio value="pro">Pro</void-radio>
    <void-radio value="team">Team</void-radio>
  </void-radio-group>
  <void-switch id="news">Weekly newsletter</void-switch>
  <void-field label="Volume"><void-slider id="volume" min="0" max="100" step="10" value="50"></void-slider></void-field>
  <void-field label="Seats"><void-number-input id="seats" min="1" max="10" value="2"></void-number-input></void-field>
</main>
