<main>
  <h1>Pickers</h1>
  <void-field label="Country">
    <void-select id="country">
      <select name="country">
        <option value="" disabled selected hidden>Choose a country</option>
        <option value="nz">New Zealand</option>
        <option value="au">Australia</option>
        <option value="fj">Fiji</option>
      </select>
    </void-select>
  </void-field>
  <void-field label="Framework">
    <void-combobox id="framework" placeholder="Pick a framework">
      <void-combobox-content>
        <void-option value="react">React</void-option>
        <void-option value="vue">Vue</void-option>
        <void-option value="lit">Lit</void-option>
      </void-combobox-content>
    </void-combobox>
  </void-field>
  <void-field label="Skills">
    <void-multiselect id="skills" placeholder="Pick skills">
      <void-multiselect-content>
        <void-option value="css">CSS</void-option>
        <void-option value="js">JavaScript</void-option>
        <void-option value="html">HTML</void-option>
      </void-multiselect-content>
    </void-multiselect>
  </void-field>
</main>
