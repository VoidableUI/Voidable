<main>
  <h1>Notices</h1>
  <button id="notify">Send notification</button>
  <void-alert id="problem" color="error">
    <void-alert-title>Payment failed</void-alert-title>
    <void-alert-description>Your card was declined.</void-alert-description>
  </void-alert>
  <void-toast-container id="flash" position="bottom-right"></void-toast-container>
</main>
<script>
  document.getElementById('notify').addEventListener('click', () => {
    window.VoidUI.toast({ title: 'Changes saved', description: 'Your profile is up to date.', duration: 0 });
  });
</script>
