<!doctype html>
<!-- No data-theme on <html>: the scheme comes from the skin or the operating system. ?skin=loft applies Loft, which prefers light. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>react theme</title>
<script src="/build/harness.js"></script>
<link rel="stylesheet" href="/build/theme.css">
<link rel="stylesheet" href="/build/loft.css">
<script>
  const skin = new URLSearchParams(location.search).get('skin');
  if (skin) document.documentElement.setAttribute('data-void-skin', skin);
</script>
</head>
<body>
<main style="padding: 1rem"><div id="app"></div></main>
<script src="/build/react-app.js"></script>
<script>window.mountTheme();</script>
</body>
</html>
