<div id="root"></div>
<script src="/build/turbo.js"></script>
<script src="/build/hotwire.js"></script>
<script>
  // Workloads for specs/perf.spec.ts. Each returns milliseconds from the DOM
  // change until every component has rendered and two frames have painted.
  const root = document.getElementById('root');
  const now = () => performance.now();
  const MIX = (i) =>
    [
      `<void-button>Button ${i}</void-button>`,
      `<void-input name="i${i}" value="v${i}" aria-label="Input ${i}"></void-input>`,
      `<void-badge color="info">B${i}</void-badge>`,
      `<void-checkbox name="c${i}">Check ${i}</void-checkbox>`,
      `<void-card><void-card-header><void-card-title>Card ${i}</void-card-title></void-card-header><void-card-body><p>Body ${i}</p></void-card-body></void-card>`,
      `<void-select aria-label="Select ${i}"><select name="s${i}"><option value="a">A</option><option value="b">B</option></select></void-select>`,
      `<void-switch>S${i}</void-switch>`,
      `<void-tag>T${i}</void-tag>`,
      `<void-alert color="info"><void-alert-description>Alert ${i}</void-alert-description></void-alert>`,
      `<void-dropdown-menu><void-dropdown-menu-trigger><button>M${i}</button></void-dropdown-menu-trigger><void-dropdown-menu-content><void-dropdown-menu-item>One</void-dropdown-menu-item><void-dropdown-menu-item>Two</void-dropdown-menu-item></void-dropdown-menu-content></void-dropdown-menu>`,
    ][i % 10];
  const ROWS = (n, v) =>
    `<void-table><table><tbody>${Array.from({ length: n }, (_, i) => `<tr id="row-${i}"><td>Row ${i} ${i === 7 ? v : ''}</td><td><void-badge color="${i % 2 ? 'success' : 'info'}">${i % 2 ? 'Active' : 'Idle'}</void-badge></td><td><void-button size="sm">Edit</void-button><void-button size="sm" color="error">Delete</void-button></td><td><void-dropdown-menu><void-dropdown-menu-trigger><button aria-label="Actions">⋯</button></void-dropdown-menu-trigger><void-dropdown-menu-content><void-dropdown-menu-item>Rename</void-dropdown-menu-item><void-dropdown-menu-item>Archive</void-dropdown-menu-item><void-dropdown-menu-item destructive>Delete</void-dropdown-menu-item></void-dropdown-menu-content></void-dropdown-menu></td></tr>`).join('')}</tbody></table></void-table>`;

  const timed = async (fn) => {
    const t0 = now();
    await fn();
    await window.__settle(root);
    return now() - t0;
  };
  const clear = async () => {
    root.innerHTML = '';
    await window.__settle(root);
  };
  const heapKB = async () => {
    for (let i = 0; i < 3; i++) {
      window.gc?.();
      await new Promise((r) => setTimeout(r));
    }
    return performance.memory ? performance.memory.usedJSHeapSize / 1024 : null;
  };

  window.perf = {
    // Machine speed: plain DOM work with no components, to scale budgets on slower machines.
    // Run in an iframe with no stylesheet: in the page it measured the theme's style cost
    // (the theme styles every native control, and the figure tripled as the theme grew),
    // not the machine, so budgets scaled by it stopped meaning anything.
    async calibrate() {
      const frame = document.createElement('iframe');
      frame.style.cssText = 'position:fixed;left:0;top:0;width:800px;height:600px;border:0;visibility:hidden';
      document.body.append(frame);
      const doc = frame.contentDocument;
      const t0 = now();
      doc.body.innerHTML = Array.from({ length: 4000 }, (_, i) => `<div class="c"><span>${i}</span><button>b${i}</button><input value="${i}"></div>`).join('');
      doc.body.getBoundingClientRect();
      await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
      const ms = now() - t0;
      frame.remove();
      return ms;
    },
    async mixed1000() {
      return timed(() => (root.innerHTML = Array.from({ length: 1000 }, (_, i) => MIX(i)).join(''))).finally(clear);
    },
    async table500() {
      const first = await timed(() => (root.innerHTML = ROWS(500, 'a')));
      VoidTurbo.start();
      const morph = await timed(() => {
        const t = document.createElement('div');
        t.innerHTML = ROWS(500, 'b');
        Turbo.morphChildren(root, t);
      });
      const intact = { rows: root.querySelectorAll('tr').length, menus: root.querySelectorAll('void-dropdown-menu-content').length, row7: root.querySelector('#row-7 td').textContent.trim() };
      await clear();
      return { first, morph, intact };
    },
    // A 5,000-row table that sorts, filters and selects. Each time is from the change until every component
    // has rendered and two frames have painted. The filter step after the first is a keystroke: the rows'
    // text is cached.
    async data5000(native) {
      const box = (label) => (native ? `<input type="checkbox" aria-label="${label}">` : `<void-checkbox aria-label="${label}"></void-checkbox>`);
      const rows = Array.from({ length: 5000 }, (_, i) => `<tr data-value="r${i}"><td>${box(`Select ${i}`)}</td><td>Item ${(i * 7919) % 5000}</td><td>${(i * 31) % 977}</td></tr>`).join('');
      const first = await timed(() => (root.innerHTML = `<void-table id="big" selectable aria-label="Big"><table><thead><tr><th data-stack="select">${box("All")}</th><th data-key="name" data-sort>Name</th><th data-key="n" data-sort="number">N</th></tr></thead><tbody>${rows}</tbody></table></void-table>`));
      const big = document.getElementById('big');
      const sortText = await timed(() => big.setAttribute('sort', 'name'));
      const sortNumber = await timed(() => big.setAttribute('sort', 'n'));
      const filterFirst = await timed(() => big.setAttribute('filter', 'item 4'));
      const filterNext = await timed(() => big.setAttribute('filter', 'item 49'));
      big.removeAttribute('filter');
      await window.__settle(root);
      let events = 0;
      big.addEventListener('void-change', () => events++);
      const selectAll = await timed(() => big.querySelector(native ? 'thead input' : 'thead void-checkbox').click());
      const result = { first, sortText, sortNumber, filterFirst, filterNext, selectAll, events, selected: big.value.length, ordered: big.querySelector('tbody tr td:nth-child(3)').textContent };
      await clear();
      return result;
    },
    async select5000() {
      const ms = await timed(() => (root.innerHTML = `<void-select id="big" aria-label="Big"><select name="big"><option value="" disabled selected hidden>Pick</option>${Array.from({ length: 5000 }, (_, i) => `<option value="${i}">Option ${i}</option>`).join('')}</select></void-select>`));
      const big = document.getElementById('big');
      big.value = '4321';
      await big.updateComplete;
      const value = big.querySelector('select').value;
      await clear();
      return { ms, value };
    },
    async dialog200() {
      root.innerHTML = '<void-dialog id="dlg"><void-dialog-title>Perf</void-dialog-title><void-dialog-body><p>Body</p><input aria-label="x"></void-dialog-body><void-dialog-actions><void-button>OK</void-button></void-dialog-actions></void-dialog>';
      await window.__settle(root);
      const d = document.getElementById('dlg');
      const cycle = async (n) => {
        for (let i = 0; i < n; i++) {
          d.open = true;
          await d.updateComplete;
          d.open = false;
          await d.updateComplete;
        }
      };
      await cycle(20); // warm up
      const nodes0 = document.getElementsByTagName('*').length;
      const heap0 = await heapKB();
      const ms = await timed(() => cycle(200));
      const nodes1 = document.getElementsByTagName('*').length;
      const heap1 = await heapKB();
      await clear();
      return { ms, nodeGrowth: nodes1 - nodes0, heapGrowthKB: heap0 === null ? null : heap1 - heap0 };
    },
  };
</script>
