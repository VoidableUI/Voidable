<void-dialog id="confirm-dialog">
  <void-dialog-title>Discard this station?</void-dialog-title>
  <void-dialog-body>
    <p>The station has not been saved. Leaving this page discards the name, the antenna settings and the schedule you entered.</p>
  </void-dialog-body>
  <void-dialog-actions>
    <void-button variant="ghost">Keep editing</void-button>
    <void-button variant="filled" color="error">Discard</void-button>
  </void-dialog-actions>
</void-dialog>
