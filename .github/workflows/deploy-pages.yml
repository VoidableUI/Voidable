# SPDX-License-Identifier: MIT
name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["Release UI Package", "Release Theme Package"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install_args: "node npm:pnpm"
        env:
          MISE_NOT_FOUND_AUTO_INSTALL: "false"

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm --filter './packages/*' build

      - name: Get latest UI version
        id: get_version
        run: |
          TAG=$(git tag --list 'ui-v[0-9]*' --sort=-v:refname | head -n1)
          if [ -n "$TAG" ]; then
            VERSION=$(echo "$TAG" | sed 's|^ui-v||')
            echo "version=v${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "version=v0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Get UI bundle size
        id: get_bundle_size
        run: |
          BUNDLE_DIR="packages/ui/dist"
          test -d "$BUNDLE_DIR" || { echo "::error::$BUNDLE_DIR missing"; exit 1; }
          BYTES=$(find "$BUNDLE_DIR" -name '*.js' -type f -exec cat {} + | gzip -c | wc -c)
          test "$BYTES" -gt 0 || { echo "::error::bundle size came up zero"; exit 1; }
          KB=$(echo "scale=1; $BYTES / 1024" | bc)
          echo "size=${KB} kB" >> "$GITHUB_OUTPUT"

      - name: Build docs site
        run: pnpm --filter docs build
        env:
          VOIDABLE_VERSION: ${{ steps.get_version.outputs.version }}
          VOIDABLE_BUNDLE_SIZE: ${{ steps.get_bundle_size.outputs.size }}

      - name: Build Storybook
        run: pnpm --filter @voidable/storybook build

      - name: Merge artifacts
        run: |
          mkdir -p _site
          cp -r docs/dist/* _site/
          cp -r storybook-static _site/storybook

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
