# SPDX-License-Identifier: MIT
name: Release Vue Adapter Package

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'packages/vue/**'
      - '.github/workflows/release-ui-vue.yml'

permissions:
  contents: read

concurrency:
  group: release-ui-vue
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/_release-npm-adapter.yml
    with:
      package: "@voidable/ui-vue"
      directory: packages/vue
      tag_prefix: ui-vue-v
      tag_paths: packages/vue/**,.github/workflows/release-ui-vue.yml
