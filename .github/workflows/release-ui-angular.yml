# SPDX-License-Identifier: MIT
name: Release Angular Adapter Package

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'packages/angular/**'
      - '.github/workflows/release-ui-angular.yml'

permissions:
  contents: read

concurrency:
  group: release-ui-angular
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/_release-npm-adapter.yml
    with:
      package: "@voidable/ui-angular"
      directory: packages/angular
      tag_prefix: ui-angular-v
      tag_paths: packages/angular/**,.github/workflows/release-ui-angular.yml
