# SPDX-License-Identifier: MIT
name: Release LiveView Adapter Package

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'packages/liveview/**'
      - '!packages/liveview/hex/**'
      - '.github/workflows/release-ui-liveview.yml'

permissions:
  contents: read

concurrency:
  group: release-ui-liveview
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/_release-npm-adapter.yml
    with:
      package: "@voidable/ui-liveview"
      directory: packages/liveview
      tag_prefix: ui-liveview-v
      tag_paths: packages/liveview/**,.github/workflows/release-ui-liveview.yml
      check_script: typecheck
      build_core_in_ci: false
      build_core_in_release: false
