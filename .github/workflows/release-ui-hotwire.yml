# SPDX-License-Identifier: MIT
name: Release Hotwire Adapter Package

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'packages/hotwire/**'
      - '!packages/hotwire/gem/**'
      - '.github/workflows/release-ui-hotwire.yml'

permissions:
  contents: read

concurrency:
  group: release-ui-hotwire
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/_release-npm-adapter.yml
    with:
      package: "@voidable/ui-hotwire"
      directory: packages/hotwire
      tag_prefix: ui-hotwire-v
      tag_paths: packages/hotwire/**,.github/workflows/release-ui-hotwire.yml
