# SPDX-License-Identifier: MIT
name: Release voidable/laravel Package

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'packages/alpine/laravel/**'
      - '.github/workflows/release-composer-alpine.yml'

permissions:
  contents: read

concurrency:
  group: release-composer-alpine
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'

      - name: Install dependencies
        working-directory: packages/alpine/laravel
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        working-directory: packages/alpine/laravel
        run: vendor/bin/phpunit

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  tag:
    name: Create Tag
    runs-on: ubuntu-latest
    needs: [test, ci]
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
      changelog: ${{ steps.tag_version.outputs.changelog }}
      should_release: ${{ steps.check_tag.outputs.should_release }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Bump version and create tag
        id: tag_version
        uses: Work-Fort/github-tag-action@1646d43eb5b675393a4e9ed36ae55ef35e0c07b2 # v6.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false
          release_branches: master
          tag_prefix: composer-alpine-v
          paths: packages/alpine/laravel/**,.github/workflows/release-composer-alpine.yml

      - name: Check if new tag was created
        id: check_tag
        run: |
          if [ -n "$TAG" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          TAG: ${{ steps.tag_version.outputs.new_tag }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: tag
    permissions:
      contents: write
    if: needs.tag.outputs.should_release == 'true'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.tag.outputs.new_tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.tag.outputs.new_tag }}
          name: "voidable/laravel ${{ needs.tag.outputs.new_tag }}"
          body: ${{ needs.tag.outputs.changelog }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
