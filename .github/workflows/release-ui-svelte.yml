# SPDX-License-Identifier: MIT
name: Release Svelte Adapter Package

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'packages/svelte/**'
      - '.github/workflows/release-ui-svelte.yml'

permissions:
  contents: read

concurrency:
  group: release-ui-svelte
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/_release-npm-adapter.yml
    with:
      package: "@voidable/ui-svelte"
      directory: packages/svelte
      tag_prefix: ui-svelte-v
      tag_paths: packages/svelte/**,.github/workflows/release-ui-svelte.yml
