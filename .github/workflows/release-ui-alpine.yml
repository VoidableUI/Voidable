# SPDX-License-Identifier: MIT
name: Release Alpine Adapter Package

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'packages/alpine/**'
      - '!packages/alpine/laravel/**'
      - '.github/workflows/release-ui-alpine.yml'

permissions:
  contents: read

concurrency:
  group: release-ui-alpine
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/_release-npm-adapter.yml
    with:
      package: "@voidable/ui-alpine"
      directory: packages/alpine
      tag_prefix: ui-alpine-v
      tag_paths: packages/alpine/**,.github/workflows/release-ui-alpine.yml
      build_core_in_ci: false
      build_core_in_release: false
      pin_core_version: false
