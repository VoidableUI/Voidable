# SPDX-License-Identifier: MIT
name: Release Solid Adapter Package

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'packages/solid/**'
      - '.github/workflows/release-ui-solid.yml'

permissions:
  contents: read

concurrency:
  group: release-ui-solid
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/_release-npm-adapter.yml
    with:
      package: "@voidable/ui-solid"
      directory: packages/solid
      tag_prefix: ui-solid-v
      tag_paths: packages/solid/**,.github/workflows/release-ui-solid.yml
