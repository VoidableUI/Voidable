# SPDX-License-Identifier: MIT
name: Release React Adapter Package

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'packages/react/**'
      - '.github/workflows/release-ui-react.yml'

permissions:
  contents: read

concurrency:
  group: release-ui-react
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/_release-npm-adapter.yml
    with:
      package: "@voidable/ui-react"
      directory: packages/react
      tag_prefix: ui-react-v
      tag_paths: packages/react/**,.github/workflows/release-ui-react.yml
