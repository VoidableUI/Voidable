# SPDX-License-Identifier: MIT
#
# The one release pipeline. Every package shares one version number.
#
# On every push to master: CI runs once. If the push brings releasing commits
# (feat, fix, perf, revert or breaking, touching packages/**) since the last
# vX.Y.Z tag, the next version is computed (scripts/release/version.mjs),
# tagged, stamped into every manifest and published in order:
#
#   plan ─┬─────────────────────────────────────────────┐
#   ci ───┴─ tag ─ npm-core ─ npm-adapters ─┬─ gem ──────┤
#                                           ├─ hex ──────┼─ github-release ─ pages-build ─ pages-deploy
#                                           └─ composer ─┘
#   tag ─ binaries ──────────────────────────────── binaries-attach  (needs github-release too)
#
# The voidable command-line binaries are built beside the packages and attached
# to the GitHub release afterwards. Nothing above waits for them: no package,
# release or Pages job lists `binaries` or `binaries-attach` in its needs, so a
# failure to build or upload them cannot stop or undo a publish.
#
# Docs-only pushes skip the packages and redeploy Pages. A manual run either
# dry-runs (default: builds and packs everything, publishes nothing) or
# re-runs a release: each step skips what is already on its registry, and a
# commit that already carries its vX.Y.Z tag resumes at that version.
# The logic lives in scripts/release/ and runs locally (mise run release:dry-run).
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and pack everything, publish nothing
        type: boolean
        default: true
      deploy_pages:
        description: Also deploy the docs and Storybook (ignored for a dry run)
        type: boolean
        default: false

permissions:
  contents: read

# One release at a time, never cancelled midway. A newer push waits; it
# releases everything since the last tag, so a superseded pending run loses nothing.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # No job installs every toolchain in mise.toml; do not let `mise run` try.
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  MISE_NOT_FOUND_AUTO_INSTALL: "false"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
      publish: ${{ steps.plan.outputs.publish }}
      pages: ${{ steps.plan.outputs.pages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: node

      - name: Plan the release
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          DEPLOY_PAGES_INPUT: ${{ inputs.deploy_pages }}
        run: mise run release:plan

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  tag:
    name: Tag
    needs: [plan, ci]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create and push the release tag
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
          SHA: ${{ github.sha }}
        run: scripts/release/tag.sh

  npm-core:
    name: npm (theme and core)
    needs: [plan, tag]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: "node npm npm:pnpm"

      - run: mise run install

      - name: Build, pack and publish @voidable/theme and @voidable/ui
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
        run: mise run release:npm core

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-npm-core
          path: release-artifacts/npm/*.tgz
          if-no-files-found: error

  npm-adapters:
    name: npm (adapters)
    needs: [plan, npm-core]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: "node npm npm:pnpm"

      - run: mise run install

      - name: Build, pack and publish the four adapters
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
        run: mise run release:npm adapters

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-npm-adapters
          path: release-artifacts/npm/*.tgz
          if-no-files-found: error

  gem:
    name: RubyGems (voidable-hotwire)
    needs: [plan, npm-adapters]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # RubyGems trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: node

      # Prebuilt Ruby from setup-ruby: mise would compile it from source. The
      # version is the one mise.toml pins.
      - name: Read the Ruby version from mise.toml
        id: versions
        run: echo "ruby=$(mise config get tools.ruby)" >> "$GITHUB_OUTPUT"

      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: ${{ steps.versions.outputs.ruby }}

      - name: Configure RubyGems credentials
        if: needs.plan.outputs.dry_run != 'true'
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Test, build and push the gem
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
        run: mise run release:gem

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-gem
          path: release-artifacts/gem/*.gem
          if-no-files-found: error

  hex:
    name: Hex (live_voidable)
    needs: [plan, npm-adapters]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: node

      # Prebuilt Erlang and Elixir from setup-beam: mise would compile Erlang
      # from source. The versions are the ones mise.toml pins ("1.19.5-otp-28"
      # is split into the Elixir and OTP versions setup-beam takes).
      - name: Read the Erlang and Elixir versions from mise.toml
        id: versions
        run: |
          {
            echo "otp=$(mise config get tools.erlang)"
            echo "elixir=$(mise config get tools.elixir | sed 's/-otp-.*$//')"
          } >> "$GITHUB_OUTPUT"

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ steps.versions.outputs.otp }}
          elixir-version: ${{ steps.versions.outputs.elixir }}
          version-type: strict

      - name: Test, build and publish the Hex package
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
          HEX_API_KEY: ${{ needs.plan.outputs.dry_run != 'true' && secrets.HEX_API_KEY || '' }}
        run: mise run release:hex

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-hex
          path: release-artifacts/hex/*.tar
          if-no-files-found: error

  composer:
    name: Composer (voidable/laravel)
    needs: [plan, npm-adapters]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          tools: composer

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: node

      - name: Load the mirror's deploy key
        if: needs.plan.outputs.dry_run != 'true'
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.LARAVEL_DEPLOY_KEY }}

      - name: Test and split to VoidableUI/laravel
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
          SHA: ${{ github.sha }}
        # Not through `mise run`: PHP comes from setup-php, not mise.
        run: scripts/release/composer.sh

  # The voidable command-line binaries. Runs beside npm-core, needs nothing the
  # package jobs produce, and no other job needs it (see the header): a failure
  # here leaves every publish and the release as they are. Only this job may
  # write attestations.
  binaries:
    name: Binaries (voidable)
    needs: [plan, tag]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # sign the build provenance (Sigstore)
      attestations: write # store it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: "node npm npm:pnpm"

      - run: mise run install

      # Stamps the version, builds @voidable/ui and the theme from the stamped
      # checkout, embeds them, cross-compiles, packs and checksums, then runs the
      # linux binary's `install` to check the embedded files are at VERSION.
      - name: Build, package and checksum the binaries
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: mise run release:binaries

      # Not in a dry run: provenance for archives nobody will download is noise.
      - name: Attest build provenance
        if: needs.plan.outputs.dry_run != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-artifacts/binaries/dist/*

      # Named binaries-dist, not release-*: github-release downloads release-*
      # and must never pick these up.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-dist
          path: release-artifacts/binaries/dist/*
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: [plan, npm-core, npm-adapters, gem, hex, composer]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: node

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release-artifacts/files
          merge-multiple: true

      - name: Create the GitHub release
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          PREVIOUS_TAG: ${{ needs.plan.outputs.previous_tag }}
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/release/github-release.sh release-artifacts/files/*

  # After the release exists. Never a dependency of anything.
  binaries-attach:
    name: Attach binaries
    needs: [plan, github-release, binaries]
    if: >-
      !cancelled() && needs.github-release.result == 'success' &&
      needs.binaries.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # upload release assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: node

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries-dist
          path: release-artifacts/binaries/dist

      - name: Attach the binaries to the GitHub release
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/release/binaries-attach.sh

  pages-build:
    name: Build Pages
    needs: [plan, ci, github-release]
    # After a successful release, after a docs-only push, or in a dry run (build only).
    if: >-
      !cancelled() && needs.ci.result == 'success' &&
      (needs.plan.outputs.pages == 'true' || needs.plan.outputs.dry_run == 'true') &&
      (needs.plan.outputs.publish != 'true' || needs.github-release.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the docs read the newest vX.Y.Z tag when no release ran
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: "node npm:pnpm"

      # For the visual review gallery at /gallery/. Optional: when this fails the
      # gallery step of release:pages warns and the site deploys without it.
      - name: Install Chromium for the visual review gallery
        continue-on-error: true
        run: mise run test:browser:install -- --with-deps
        env:
          VOID_BROWSERS: chromium

      - name: Build docs and Storybook
        env:
          VOIDABLE_VERSION: ${{ needs.plan.outputs.release == 'true' && needs.plan.outputs.version || '' }}
        run: mise run release:pages

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  pages-deploy:
    name: Deploy Pages
    needs: [plan, pages-build]
    if: >-
      !cancelled() && needs.pages-build.result == 'success' &&
      needs.plan.outputs.pages == 'true' && needs.plan.outputs.dry_run != 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
