name: Bug report
description: Something is broken or behaves differently from the docs
labels: [bug]
body:
  - type: input
    id: package
    attributes:
      label: Package and version
      description: For example @voidable/ui 0.7.0 and @voidable/theme 0.8.0
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: A minimal snippet or a link to a repository or StackBlitz.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, framework and bundler, with versions
