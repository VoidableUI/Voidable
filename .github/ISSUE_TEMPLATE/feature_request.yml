name: Feature request
description: Suggest a component, attribute or adapter improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Components must stay unstyled without a theme and render in the Light DOM.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
