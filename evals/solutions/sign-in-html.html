<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: var(--void-space-4); box-sizing: border-box; }
    main { width: 100%; max-width: 24rem; }
    form { display: grid; gap: var(--void-space-4); }
  </style>
</head>
<body>
  <main>
    <h1>Sign in</h1>
    <form action="/session" method="post">
      <void-field label="Email">
        <void-input type="email" name="email" required></void-input>
      </void-field>
      <void-field label="Password">
        <void-input type="password" name="password" required></void-input>
      </void-field>
      <void-checkbox name="remember">Remember me</void-checkbox>
      <void-button type="submit" variant="filled">Sign in</void-button>
    </form>
    <p><a href="/password/reset">Forgot password?</a></p>
  </main>
</body>
</html>
